<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>103 SELECTED</title>
    <style>
        /* --- 1. 기본 세팅 및 타이포그래피 (크기 확 키움!) --- */
        body, html { margin: 0; padding: 0; width: 100%; height: 100vh; background-color: #ffffff; font-family: 'Helvetica', 'Apple SD Gothic Neo', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .logo-btn { position: absolute; display: flex; font-size: 6vw; font-weight: bold; color: #000000; cursor: pointer; z-index: 50; }
        .logo-btn:hover { opacity: 0.5; }
        .split-left, .split-right { transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); }
        
        .top-left-logo { position: absolute; top: 40px; left: 50px; font-size: 1.5vw; font-weight: bold; color: #000000; letter-spacing: 1px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100; cursor: pointer; }
        .top-left-logo:hover { opacity: 0.5; }
        
        .center-menu { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 7vh; opacity: 0; transform: translateY(20px); pointer-events: none; transition: all 0.3s ease; z-index: 40; }
        .menu-item { font-size: 3.5vw; font-weight: bold; color: #000000; cursor: pointer; letter-spacing: 4px; transition: transform 0.3s ease; }
        .menu-item:hover { transform: scale(1.2); }
        
        .top-right-nav { position: absolute; top: 40px; right: 50px; display: flex; gap: 2.5vw; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100; }
        .nav-item { font-size: 1vw; font-weight: bold; color: #000000; cursor: pointer; letter-spacing: 2px; transition: opacity 0.3s ease; }
        .nav-item:hover { opacity: 0.4; }
        
        /* 공통 도화지 (가운데를 뚫고 지나가는 긴 스크롤 영역) */
        .page-content { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 20; overflow-y: auto; scrollbar-width: none; }
        .page-content::-webkit-scrollbar { display: none; } 

        /* 랩퍼: 위아래 여백을 줘서 리스트가 중앙에 예쁘게 놓이게 함 */
        .content-wrapper { display: flex; flex-direction: column; align-items: center; padding-top: 10vh; padding-bottom: 20vh; width: 80%; max-width: 1200px; margin: 0 auto; height: auto; min-height: 100%; }

        /* --- 2. 정중앙을 완벽하게 맞춘 메인 뷰 (SHOP, ARCHIVE 첫 화면) --- */
        .center-view { width: 100%; flex-grow: 1; display: none; flex-direction: column; justify-content: center; align-items: center; margin-top: -10vh; /* 시각적 중앙 보정 */ }
        .center-view.active { display: flex; }
        
        .menu-list-container { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 8vh; }
        .main-item { font-size: 3.5vw; font-weight: bold; color: #000; cursor: pointer; letter-spacing: 5px; transition: all 0.3s ease; text-align: center; }
        .main-item:hover { color: #888; transform: scale(1.1); }
        .new-arrival-text { color: #d32f2f; } 

        /* --- 3. 위로 쫙 달라붙은 서브/리스트 뷰 --- */
        .top-view { width: 100%; display: none; flex-direction: column; align-items: center; }
        .top-view.active { display: flex; }

        /* 서브메뉴(브랜드/카테고리) 항목 크기 대폭 확대 */
        .sub-list-container { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 6vh; }
        .sub-menu-item { font-size: 3vw; font-weight: bold; color: #000; cursor: pointer; letter-spacing: 4px; transition: all 0.3s ease; text-align: center; }
        .sub-menu-item:hover { color: #888; transform: scale(1.1); }

        /* =======================================================
           ★ 4. 1픽셀도 안 흔들리는 완벽한 헤더 (BACK & 타이틀) ★ 
           ======================================================= */
        .view-header {
            position: relative; width: 100%; display: flex; justify-content: center; align-items: flex-end;
            border-bottom: 2px solid #000; padding-bottom: 1.5vh; margin-top: 0; margin-bottom: 8vh; min-height: 5vh;
        }
        .current-list-title { font-size: 2.5vw; font-weight: bold; color: #000; letter-spacing: 5px; text-transform: uppercase; margin: 0; line-height: 1; }
        .btn-back { position: absolute; left: 0; bottom: 1.5vh; font-size: 1.2vw; font-weight: bold; color: #999; cursor: pointer; letter-spacing: 2px; transition: color 0.3s ease; margin: 0; line-height: 1; }
        .btn-back:hover { color: #000; }
        /* ======================================================= */

        /* --- 5. 그리드 (상품 목록) --- */
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8vh 4vw; width: 100%; }
        .shop-grid-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.3s ease; }
        .shop-grid-item:hover { transform: translateY(-5px); }
        
        .grid-image-wrapper { position: relative; width: 100%; aspect-ratio: 3 / 4; background-color: #f4f4f4; margin-bottom: 2vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .grid-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .grid-no-image { font-size: 1vw; color: #aaa; letter-spacing: 2px; font-weight: bold; }
        
        .grid-brand { font-size: 1.2vw; font-weight: bold; color: #000; margin-bottom: 0.5vh; text-align: center; letter-spacing: 1px; }
        .grid-title-line { font-size: 1.2vw; font-weight: bold; color: #000; text-align: center; letter-spacing: 1px; margin-bottom: 0.5vh; width: 90%; line-height: 1.4; }
        .grid-price { font-size: 1.1vw; font-weight: normal; color: #666; letter-spacing: 1px; text-align: center; margin-top: 0.5vh; }

        .sold-text .grid-brand, .sold-text .grid-title-line, .sold-text .grid-price { color: #bbb; }
        .sold-image-wrapper::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom right, transparent calc(50% - 0.5px), rgba(0,0,0,0.2) calc(50% - 0.5px), rgba(0,0,0,0.2) calc(50% + 0.5px), transparent calc(50% + 0.5px)), linear-gradient(to top right, transparent calc(50% - 0.5px), rgba(0,0,0,0.2) calc(50% - 0.5px), rgba(0,0,0,0.2) calc(50% + 0.5px), transparent calc(50% + 0.5px)); pointer-events: none; }

        /* 아카이브 텍스트 목록 (밑줄 없음, 호버 시 줌인) */
        .archive-list-item { font-size: 2.5vw; font-weight: bold; color: #000; cursor: pointer; letter-spacing: 2px; text-align: center; width: 100%; transition: all 0.3s ease; }
        .archive-list-item:hover { color: #888; transform: scale(1.1); }
        
        /* CONTACT (화면 정중앙 배치 & 메일주소 볼드 처리) */
        #page-contact { justify-content: center; }
        .contact-list { display: flex; flex-direction: column; align-items: center; gap: 8vh; font-size: 2.5vw; font-weight: bold; color: #000; letter-spacing: 2px; line-height: 1.8; text-align: center; transform: translateY(-5vh); /* 중앙에서 살짝 위로 */ }
        .contact-list a { color: #000; text-decoration: none; border-bottom: 2px solid #000; padding-bottom: 4px; transition: color 0.3s, border-color 0.3s; }
        .contact-list a:hover { color: #888; border-color: #888; }
        .mail-text { font-weight: bold; border-bottom: none !important; cursor: default; }

        /* 팝업 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: all 0.5s ease; z-index: 200; }
        .modal-content { position: relative; width: 75vw; height: 85vh; display: flex; flex-direction: column; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); }
        .btn-close-modal { align-self: flex-end; font-size: 1.2vw; font-weight: bold; cursor: pointer; margin-bottom: 20px; letter-spacing: 2px; transition: opacity 0.3s ease; }
        .btn-close-modal:hover { opacity: 0.4; }
        .modal-gallery { display: flex; gap: 20px; height: 50vh; overflow-x: auto; scrollbar-width: none; }
        .modal-gallery::-webkit-scrollbar { display: none; }
        .modal-image { min-width: 35vw; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 1vw; color: #999; letter-spacing: 2px; background-color: #f0f0f0; }
        img.modal-image { object-fit: contain; background-color: transparent; }
        .modal-info { margin-top: 3vh; font-size: 1.1vw; line-height: 1.8; color: #000; letter-spacing: 1px; }
        .buy-btn-container { position: absolute; bottom: 0; right: 0; }
        .buy-btn { font-size: 1.5vw; font-weight: bold; color: #000; cursor: pointer; text-decoration: none; letter-spacing: 2px; transition: opacity 0.3s ease; }
        .buy-btn:hover { opacity: 0.4; }
        .disable-btn { color: #ccc; cursor: default; }

        /* 화면 전환 액션 */
        body.menu-mode .logo-btn { pointer-events: none; }
        body.menu-mode .split-left { transform: translateX(-10vw); opacity: 0; filter: blur(8px); }
        body.menu-mode .split-right { transform: translateX(10vw); opacity: 0; filter: blur(8px); }
        body.menu-mode .center-menu { opacity: 1; pointer-events: auto; transform: translateY(0); transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.2s; }
        body.menu-mode .top-left-logo { opacity: 1; pointer-events: auto; transition: opacity 0.8s ease 0.4s; }
        body.page-mode .logo-btn { pointer-events: none; }
        body.page-mode .split-left { transform: translateX(-10vw); opacity: 0; filter: blur(8px); }
        body.page-mode .split-right { transform: translateX(10vw); opacity: 0; filter: blur(8px); }
        body.page-mode .top-left-logo { opacity: 1; pointer-events: auto; transition: opacity 0.8s ease 0s; }
        body.page-mode .top-right-nav { opacity: 1; pointer-events: auto; transition: opacity 0.8s ease 0.2s; }
        .page-content.is-open { opacity: 1; pointer-events: auto; transition: opacity 0.8s ease 0.4s; }
        body.modal-open .modal-overlay { opacity: 1; pointer-events: auto; }
        body.modal-open .modal-content { transform: translateY(0); }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .logo-btn { font-size: 12vw; } .top-left-logo { top: 20px; left: 20px; font-size: 4vw; } .top-right-nav { top: 20px; right: 20px; gap: 4vw; }
            .nav-item { font-size: 3vw; } .menu-item { font-size: 8vw; } 
            .content-wrapper { width: 90vw; padding-top: 8vh; }
            .main-item { font-size: 8vw; } .sub-menu-item { font-size: 7vw; } .archive-list-item { font-size: 6vw; }
            .view-header { margin-bottom: 6vh; padding-bottom: 1.5vh; }
            .current-list-title { font-size: 5vw; } .btn-back { font-size: 3.5vw; bottom: 1.5vh; }
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 4vh 3vw; } 
            .grid-brand, .grid-title-line, .grid-price { font-size: 3vw; width: 100%; }
            .modal-content { width: 90vw; height: 80vh; } .modal-image { min-width: 80vw; height: 40vh; }
            .btn-close-modal { font-size: 4vw; } .modal-info { font-size: 3.5vw; } .buy-btn { font-size: 4.5vw; }
            .contact-list { font-size: 5vw; }
        }
    </style>
</head>
<body>

    <div class="top-left-logo" id="btn-home">103 SELECTED</div>
    <div class="top-right-nav">
        <div class="nav-item" onclick="openPage('shop')">SHOP</div>
        <div class="nav-item" onclick="openPage('archive')">ARCHIVE</div>
        <div class="nav-item" onclick="openPage('contact')">CONTACT</div>
    </div>
    <div class="logo-btn" id="btn-main-logo"><span class="split-left">103&nbsp;</span><span class="split-right">SELECTED</span></div>
    <div class="center-menu">
        <div class="menu-item" onclick="openPage('shop')">SHOP</div>
        <div class="menu-item" onclick="openPage('archive')">ARCHIVE</div>
        <div class="menu-item" onclick="openPage('contact')">CONTACT</div>
    </div>

    <div class="page-content" id="page-shop">
        <div class="content-wrapper">
            <div id="view-shop-main" class="center-view active">
                <div class="menu-list-container">
                    <div class="main-item new-arrival-text" onclick="showShopList('NEW', 'NEW')">NEW</div>
                    <div class="main-item" onclick="showShopList('ALL', 'ALL')">ALL</div>
                    <div class="main-item" onclick="showShopSubMenu('BRANDS')">BRANDS</div>
                    <div class="main-item" onclick="showShopSubMenu('CATEGORIES')">CATEGORIES</div>
                </div>
            </div>
            
            <div id="view-shop-sub" class="top-view">
                <div class="view-header">
                    <div class="btn-back" onclick="changeShopView('main')">< BACK</div>
                    <div class="current-list-title" id="shop-sub-title">TITLE</div>
                </div>
                <div class="sub-list-container" id="shop-sub-container"></div>
            </div>
            
            <div id="view-shop-list" class="top-view">
                <div class="view-header">
                    <div class="btn-back" id="btn-shop-list-back">< BACK</div>
                    <div class="current-list-title" id="shop-list-title">TITLE</div>
                </div>
                <div class="grid-container" id="item-list-container"></div>
            </div>
        </div>
    </div>

    <div class="page-content" id="page-archive">
        <div class="content-wrapper">
            <div id="view-archive-main" class="center-view active">
                <div class="menu-list-container" id="archive-main-container"></div>
            </div>
            
            <div id="view-archive-list" class="top-view">
                <div class="view-header">
                    <div class="btn-back" onclick="changeArchiveView('main')">< BACK</div>
                    <div class="current-list-title" id="archive-list-title">TITLE</div>
                </div>
                <div class="sub-list-container" id="archive-grid-container"></div>
            </div>
            
            <div id="view-archive-detail" class="top-view">
                <div class="view-header">
                    <div class="btn-back" id="archive-detail-back">< BACK</div>
                    <div class="current-list-title" id="archive-detail-title">TITLE</div>
                </div>
                <div id="archive-detail-content" style="width:100%;"></div>
            </div>
        </div>
    </div>

    <div class="page-content" id="page-contact">
        <div class="contact-list" id="contact-container"><div>Mail: 불러오는 중...</div></div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="btn-close-modal" id="btn-close-modal">CLOSE</div>
            <div class="modal-gallery" id="modal-gallery"></div>
            <div class="modal-info" id="modal-info"></div>
            <div class="buy-btn-container" id="buy-btn-container"></div>
        </div>
    </div>

    <script>
        const GITHUB_OWNER = "103selected";
        const GITHUB_REPO = "103-selected";
        const DB_URL = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/database.json?t=${Date.now()}`;

        let products = []; let archives = []; let globalData = {}; let brandCounts = {}; 

        async function loadDatabase() {
            try {
                const response = await fetch(DB_URL);
                if (!response.ok) throw new Error("데이터를 찾을 수 없습니다.");
                globalData = await response.json();
                products = globalData.products || []; archives = globalData.archives || [];
                brandCounts = {}; products.forEach(p => { let b = p.brand || "UNKNOWN"; brandCounts[b] = (brandCounts[b] || 0) + 1; });
                renderContact();
            } catch (error) { console.error("데이터 로딩 실패:", error); }
        }
        window.onload = loadDatabase;

        function renderContact() {
            const contactData = globalData.contact || {};
            const displayEmail = (contactData.email && contactData.email !== "undefined") ? contactData.email : "103selected@gmail.com";
            const displayInsta = contactData.insta || "https://instagram.com/103selected";
            const displayFruits = contactData.fruits || "https://fruitsfamily.com/seller/u1ap/103selected";
            
            document.getElementById('contact-container').innerHTML = `
                <div>Mail: <span class="mail-text">${displayEmail}</span></div>
                <div>INSTAGRAM: <a href="${displayInsta}" target="_blank">@103selected</a></div>
                <div>FRUITSFAMILY: <a href="${displayFruits}" target="_blank">@103SELECTED</a></div>
            `;
        }

        function formatPrice(originalStr, discountStr) {
            if (!discountStr || discountStr.trim() === "" || parseInt(discountStr) === 0) return originalStr;
            const origNum = parseInt(originalStr.replace(/[^0-9]/g, ''));
            const finalStr = '₩' + Math.floor(origNum * ((100 - parseInt(discountStr)) / 100)).toLocaleString('ko-KR');
            return `<span style="color:#aaa;">${originalStr}</span> &nbsp;&nbsp; <span style="font-weight:bold; color:#000;">${finalStr}</span> <span style="color:#d32f2f; font-weight:bold;">(${discountStr}%)</span>`;
        }

        function getYouTubeVideoId(url) {
            let videoId = ''; if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0]; else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0]; return videoId;
        }

        const body = document.body;
        document.getElementById('btn-main-logo').addEventListener('click', () => { body.className = 'menu-mode'; });
        document.getElementById('btn-home').addEventListener('click', () => { body.className = ''; document.querySelectorAll('.page-content').forEach(p => p.classList.remove('is-open')); });
        
        function openPage(pageId) { 
            body.className = 'page-mode'; 
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('is-open')); 
            document.getElementById('page-' + pageId).classList.add('is-open'); 
            if(pageId === 'shop') changeShopView('main'); 
            if(pageId === 'archive') changeArchiveView('main'); 
        }

        // ====== SHOP 로직 ======
        function changeShopView(viewName) {
            document.getElementById('view-shop-main').classList.remove('active'); document.getElementById('view-shop-sub').classList.remove('active'); document.getElementById('view-shop-list').classList.remove('active');
            document.getElementById('view-shop-' + viewName).classList.add('active');
        }

        function showShopSubMenu(type) {
            changeShopView('sub');
            document.getElementById('shop-sub-title').innerText = type; 
            const subContainer = document.getElementById('shop-sub-container'); subContainer.innerHTML = '';
            
            if (type === 'BRANDS') {
                let majorBrands = []; let hasOther = false;
                for (let b in brandCounts) { if (brandCounts[b] >= 2) majorBrands.push(b); else hasOther = true; }
                majorBrands.sort(); if (hasOther) majorBrands.push("OTHER BRANDS");
                majorBrands.forEach(brand => { subContainer.innerHTML += `<div class="sub-menu-item" onclick="showShopList('BRAND', '${brand}')">${brand}</div>`; });
            } else if (type === 'CATEGORIES') {
                ["OUTER", "TOP", "BOTTOM", "SHOES", "ACC"].forEach(cat => { subContainer.innerHTML += `<div class="sub-menu-item" onclick="showShopList('CATEGORY', '${cat}')">${cat}</div>`; });
            }
        }

        function showShopList(filterType, filterValue) {
            changeShopView('list');
            document.getElementById('shop-list-title').innerText = filterValue; 

            if (filterType === 'ALL' || filterType === 'NEW') document.getElementById('btn-shop-list-back').onclick = () => changeShopView('main');
            else if (filterType === 'BRAND') document.getElementById('btn-shop-list-back').onclick = () => showShopSubMenu('BRANDS');
            else if (filterType === 'CATEGORY') document.getElementById('btn-shop-list-back').onclick = () => showShopSubMenu('CATEGORIES');

            let filteredItems = [];
            products.forEach((product, index) => {
                let match = false; let itemBrand = product.brand || "UNKNOWN";
                if (filterType === 'ALL') match = true;
                else if (filterType === 'NEW') { if (product.newDays && parseInt(product.newDays) > 0) { const ageInMs = Date.now() - product.createdAt; if (ageInMs <= parseInt(product.newDays) * 24 * 60 * 60 * 1000) match = true; } }
                else if (filterType === 'CATEGORY') { if (product.category === filterValue) match = true; }
                else if (filterType === 'BRAND') { if (filterValue === "OTHER BRANDS") { if (brandCounts[itemBrand] === 1) match = true; } else { if (itemBrand === filterValue) match = true; } }
                if (match) filteredItems.push({ ...product, originalIndex: index });
            });

            let availableHtml = ''; let comingHtml = ''; let soldHtml = ''; let currentNumber = 1; 
            filteredItems.forEach(item => {
                let firstImg = item.images && item.images.length > 0 ? `<img src="${item.images[0]}">` : `<div class="grid-no-image">NO IMAGE</div>`;
                let priceHtml = formatPrice(item.price, item.discount); let bName = item.brand || "UNKNOWN";
                let isNew = false; if (item.newDays && parseInt(item.newDays) > 0) { const ageInMs = Date.now() - item.createdAt; if (ageInMs <= parseInt(item.newDays) * 24 * 60 * 60 * 1000) isNew = true; }
                let newTag = isNew ? `<span style="color:#d32f2f; font-size:var(--font-tiny); font-weight:bold; margin-right:6px; vertical-align:middle;">NEW</span>` : '';
                let numStr = currentNumber < 10 ? '0' + currentNumber : currentNumber;
                let cardInner = `<div class="grid-image-wrapper">${firstImg}</div><div class="grid-brand">[${bName}]</div><div class="grid-title-line">${newTag}${item.status === 'available' ? numStr + '.' : (item.status === 'coming' ? '' : 'Sold.')} ${item.name}</div><div class="grid-price">${item.status === 'available' ? priceHtml : (item.status === 'coming' ? 'Coming Soon' : 'Sold Out')}</div>`;
                if (item.status === "available") { availableHtml += `<div class="shop-grid-item" onclick="openModal(${item.originalIndex})">${cardInner}</div>`; currentNumber++; } 
                else if (item.status === "coming") { comingHtml += `<div class="shop-grid-item" onclick="openModal(${item.originalIndex})">${cardInner}</div>`; } 
                else if (item.status === "sold") { soldHtml += `<div class="shop-grid-item sold-text" onclick="openModal(${item.originalIndex})">${cardInner}</div>`; }
            });
            document.getElementById('item-list-container').innerHTML = availableHtml + comingHtml + soldHtml;
        }

        // ====== ARCHIVE 로직 ======
        function changeArchiveView(viewName) {
            document.getElementById('view-archive-main').classList.remove('active'); document.getElementById('view-archive-list').classList.remove('active'); document.getElementById('view-archive-detail').classList.remove('active');
            document.getElementById('view-archive-' + viewName).classList.add('active');
            if (viewName === 'main') {
                const mainContainer = document.getElementById('archive-main-container'); mainContainer.innerHTML = '';
                let order = ["LOOKBOOK", "VIDEO", "FLEA MARKET"];
                let uniqueCategories = [...new Set(archives.map(a => a.category || "LOOKBOOK"))];
                uniqueCategories.sort((a, b) => { let idxA = order.indexOf(a); let idxB = order.indexOf(b); if(idxA === -1) idxA = 999; if(idxB === -1) idxB = 999; return idxA - idxB; });
                if (uniqueCategories.length === 0) { mainContainer.innerHTML = '<div class="main-item">발행된 콘텐츠가 없습니다.</div>'; return; }
                uniqueCategories.forEach(cat => { mainContainer.innerHTML += `<div class="main-item" onclick="showArchiveList('${cat}')">${cat}</div>`; });
            }
        }
        function generateArchiveMenu() { changeArchiveView('main'); }

        function showArchiveList(category) {
            changeArchiveView('list');
            document.getElementById('archive-list-title').innerText = category;
            const container = document.getElementById('archive-grid-container'); container.innerHTML = '';
            let filtered = archives.filter(a => (a.category || "LOOKBOOK") === category);
            filtered.forEach((item, index) => {
                let prefixText = item.prefix ? `${item.prefix} ` : '';
                container.innerHTML += `<div class="archive-list-item" onclick="openArchiveDetail('${item.id}', '${category}')">${prefixText}${item.title}</div>`;
            });
        }

        function openArchiveDetail(id, category) {
            changeArchiveView('detail');
            const item = archives.find(a => a.id === id);
            let prefixText = item.prefix ? `${item.prefix} ` : '';
            document.getElementById('archive-detail-title').innerText = category;
            document.getElementById('btn-archive-detail-back').onclick = () => showArchiveList(category);
            
            let mediaHtml = '';
            if (item.youtube && item.youtube.trim() !== '') {
                const videoId = getYouTubeVideoId(item.youtube);
                if (videoId) { mediaHtml = `<iframe width="100%" height="800" style="max-height: 70vh; margin-top: 50px;" src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`; }
            } else if (item.images && item.images.length > 0) {
                mediaHtml = `<div style="column-count: 3; column-gap: 20px; margin-top: 50px; width: 100%;">`;
                item.images.forEach(img => { mediaHtml += `<img src="${img}" style="width: 100%; display: block; margin-bottom: 20px; background: #f4f4f4;">`; });
                mediaHtml += `</div>`;
            }
            document.getElementById('archive-detail-content').innerHTML = `<div style="margin-bottom:10vh; width:100%; text-align:center;"><div style="font-size:var(--font-huge); font-weight:bold; letter-spacing:2px;">${prefixText}${item.title}</div>${item.desc ? `<div style="font-size:var(--font-medium); color:#666; margin-top:20px; white-space:pre-wrap;">${item.desc}</div>` : ''}${mediaHtml}</div>`;
        }

        // ====== 공통 모달(팝업) 로직 ======
        function openModal(index) {
            const item = products[index]; 
            let priceHtml = formatPrice(item.price, item.discount);
            if (item.status === "sold") priceHtml = "Sold."; if (item.status === "coming") priceHtml = "Coming Soon";
            
            // ★ FABRIC 정보 추가 ★
            document.getElementById('modal-info').innerHTML = `<strong>[${item.brand || 'UNKNOWN'}] ${item.name}</strong><br><br>${item.desc || '상세 설명을 준비 중입니다.'}<br><br>FABRIC: ${item.fabric || 'N/A'}<br>CONDITION: ${item.condition || 'N/A'}<br>PRICE: ${priceHtml}`;
            
            const gallery = document.getElementById('modal-gallery'); gallery.innerHTML = ''; 
            if (item.images && item.images.length > 0) { item.images.forEach(img => { gallery.innerHTML += `<img src="${img}" class="modal-image">`; }); } else { gallery.innerHTML = `<div class="modal-image">IMAGE PREPARING</div>`; }

            const btnContainer = document.getElementById('buy-btn-container');
            if (item.status === "sold") btnContainer.innerHTML = `<span class="buy-btn disable-btn">Sold Out</span>`;
            else if (item.status === "coming") btnContainer.innerHTML = `<span class="buy-btn disable-btn">Coming Soon</span>`;
            else btnContainer.innerHTML = `<a href="${item.buyLink || '#'}" target="_blank" class="buy-btn">Buy</a>`; 

            body.classList.add('modal-open');
        }
        document.getElementById('btn-close-modal').addEventListener('click', () => { body.classList.remove('modal-open'); });
    </script>
</body>
</html>
